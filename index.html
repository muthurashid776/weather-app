<!DOCTYPE html>
<html lang="en">
<head>
    <meta charst="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
          <h1>Weather App</h1>
    <div class="container">
        <div class="theme">
            <button id="themeBtn">🌙</button>
        </div>
        <div class="search-section">
            <input type="text" id="cityInput" placeholder="Enter city name..." />
            <button id="searchBtn">Search Weather</button>
        </div>
        <div id="weatherCard" class="weather-card" style="display: none;"></div>
        <div id="errorMsg" class="error" style="display: none;"></div>
        <div class="favorites-section" >
            <button id="favoritesBtn">Favorites</button>
           <div class = "favBox">
                    <button id="addfavoriteBtn">Add to Favorites</button>
                    <button id="clearFavoritesBtn">Rmove Favorites</button>
           </div> 
            
            <div id="favoritesList"></div>
        </div>
    </div>
     <script src="script.js" defer></script>
</body>
</html>
